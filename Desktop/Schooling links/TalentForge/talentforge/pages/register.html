<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Register — TalentForge</title>
<link rel="icon" type="image/jpeg" href="../assets/logo.jpg"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 24px 60px;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(255,107,26,.08) 0%,transparent 60%),var(--darker);}
.auth-box{background:var(--panel);border:1px solid var(--border);padding:48px;width:100%;max-width:480px;}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.08em;color:#fff;margin-bottom:32px;display:block;text-align:center;}
.auth-logo span{color:var(--fire);}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:#fff;margin-bottom:6px;}
.auth-sub{font-size:.88rem;color:var(--muted);margin-bottom:28px;}
.plan-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.plan-opt{border:1px solid var(--border);padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;}
.plan-opt.selected{border-color:var(--fire);background:rgba(255,107,26,.08);}
.plan-opt-name{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);}
.plan-opt-price{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--fire);}
.plan-opt.selected .plan-opt-name{color:var(--ember);}
</style>
</head>
<body>
<div class="page-loader"><div class="loader-logo">TALENT<span>FORGE</span></div></div>
<div class="auth-page">
  <div class="auth-box">
    <a href="../index.html" class="auth-logo">TALENT<span>FORGE</span></a>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-sub">Start forging your future — free forever, upgrade anytime.</p>
    <p style="font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Choose Plan</p>
    <div class="plan-select">
      <div class="plan-opt selected" onclick="selectPlan(this,'free')"><div class="plan-opt-name">Free</div><div class="plan-opt-price">R0</div></div>
      <div class="plan-opt" onclick="selectPlan(this,'pro')"><div class="plan-opt-name">Pro</div><div class="plan-opt-price">R199</div></div>
      <div class="plan-opt" onclick="selectPlan(this,'employer')"><div class="plan-opt-name">Employer</div><div class="plan-opt-price">R799</div></div>
    </div>
    <form onsubmit="handleRegister(event)">
      <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-control" id="reg-name" placeholder="John Smith" required/></div>
      <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-control" id="reg-email" placeholder="john@email.com" required/></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="reg-password" placeholder="Min. 8 characters" required minlength="8"/></div>
      <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="reg-confirm" placeholder="Repeat password" required/></div>
      <input type="hidden" id="selected-plan" value="free"/>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Create My Account →</button>
      <p style="text-align:center;margin-top:16px;font-size:.84rem;color:var(--muted);">Already have an account? <a href="#" onclick="showLogin()" style="color:var(--ember);">Sign in</a></p>
    </form>
  </div>
</div>
<div class="modal-overlay" id="modal-login">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-login')">×</button>
    <h3 class="modal-title">Sign In</h3>
    <p class="modal-sub">Welcome back to TalentForge</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" required placeholder="your@email.com"/></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" required placeholder="••••••••"/></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>
</div>
<script src="../js/main.js"></script>
<script>
let currentPlan='free';
function selectPlan(el,plan){document.querySelectorAll('.plan-opt').forEach(p=>p.classList.remove('selected'));el.classList.add('selected');currentPlan=plan;document.getElementById('selected-plan').value=plan;}
const params=new URLSearchParams(window.location.search);
if(params.get('plan')){const p=params.get('plan');document.querySelectorAll('.plan-opt').forEach(el=>{if(el.querySelector('.plan-opt-name').textContent.toLowerCase()===p){el.click();}});}
function handleRegister(e){
  e.preventDefault();
  const name=document.getElementById('reg-name').value;
  const email=document.getElementById('reg-email').value;
  const pass=document.getElementById('reg-password').value;
  const confirm=document.getElementById('reg-confirm').value;
  if(pass!==confirm){showToast('Passwords do not match','error');return;}
  TF.set('user',{name,email,plan:currentPlan,joined:new Date().toISOString()});
  showToast('Account created! Welcome to TalentForge 🔥','success');
  setTimeout(()=>window.location.href='dashboard.html',1200);
}
function showLogin(){openModal('modal-login');}
function handleLogin(e){
  e.preventDefault();
  TF.set('user',{name:'Demo User',email:'demo@talentforge.co.za',plan:'pro'});
  closeModal('modal-login');
  showToast('Signed in!','success');
  setTimeout(()=>window.location.href='dashboard.html',800);
}
</script>
</body>
</html>
